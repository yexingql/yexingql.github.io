<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 网页元信息 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网页标题，浏览器标签上显示 -->
    <title>基础HTML示例</title>
    <!-- 内嵌简单样式 -->
    <style>
        body {
            font-family: Microsoft Yahei, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <!-- 一级大标题 -->
    <h1>你好，HTML</h1>

    <!-- 段落文本 -->
    <p>这是一个最基础的HTML网页文件。HTML属于标记语言，使用标签描述页面结构。</p>

    <h2>二级标题</h2>

    <p>文本可以有 <strong>粗体</strong>、<em>斜体</em>效果。</p>

    <!-- 无序列表 -->
    <h3>学习清单</h3>
    <ul>
        <li>HTML：页面结构</li>
        <li>CSS：页面样式</li>
        <li>JavaScript：页面交互</li>
    </ul>

    <!-- 有序列表 -->
    <h3>步骤</h3>
    <ol>
        <li>新建文本文档</li>
        <li>粘贴代码</li>
        <li>保存，后缀改为 .html</li>
        <li>双击用浏览器打开</li>
    </ol>

    <!-- 超链接 -->
    <p>跳转链接：<a href="https://github.com" target="_blank">访问GitHub</a></p>

</body>
</html>
